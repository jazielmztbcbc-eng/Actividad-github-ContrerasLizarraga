<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="formRegistro">
    <div>
        <label for="nombre">Nombre completo:</label>
        <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            required
        >
    </div>

    <div>
        <label for="correo">Correo electrónico:</label>
        <input 
            type="email" 
            id="correo" 
            name="correo" 
            required
        >
    </div>
	<br>
    <div>
        <label for="password">Contraseña:</label>
        <input 
            type="password" 
            id="password" 
            name="password" 
            required
        >
    </div>

    <div>
        <label for="edad">Edad:</label>
        <input 
            type="number" 
            id="edad" 
            name="edad" 
            min="18" 
            max="100" 
            required
        >
    </div>

    <br>
    <div>
        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input 
            type="date" 
            id="fechaNacimiento" 
            name="fechaNacimiento" 
            required
        >
    </div>

    <div>
        <label>Género:</label>
        
        <input 
            type="radio" 
            id="masculino" 
            name="genero" 
            value="masculino"
            required
        >
        <label for="masculino">Masculino</label>

        <input 
            type="radio" 
            id="femenino" 
            name="genero" 
            value="femenino"
        >
        <label for="femenino">Femenino</label>
    </div>

    <br>
    <div>
        <label>Intereses:</label>

        <input 
            type="checkbox" 
            id="deportes" 
            name="intereses" 
            value="deportes"
        >
        <label for="deportes">Deportes</label>

        <input 
            type="checkbox" 
            id="musica" 
            name="intereses" 
            value="musica"
        >
        <label for="musica">Música</label>

        <input 
            type="checkbox" 
            id="lectura" 
            name="intereses" 
            value="lectura"
        >
        <label for="lectura">Lectura</label>
    </div>

    
    <div>
        <label for="foto">Fotografía de perfil:</label>
        <input 
            type="file" 
            id="foto" 
            name="foto"
        >
    </div>

    
    <div>
        <label for="colorFavorito">Color favorito:</label>
        <input 
            type="color" 
            id="colorFavorito" 
            name="colorFavorito"
        >
    </div>

	<br>    
    <div>
        <label for="satisfaccion">Nivel de satisfacción:</label>
        <input 
            type="range" 
            id="satisfaccion" 
            name="satisfaccion" 
            min="1" 
            max="10"
        >
    </div>

    
    <button type="submit">Registrar</button>
</form>
</body>
</html>
